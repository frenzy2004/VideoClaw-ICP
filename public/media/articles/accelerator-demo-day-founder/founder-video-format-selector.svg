<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Founder video format selector</title>
  <desc id="desc">Four cards compare an application video, product demo, Demo Day pitch, and follow-up video by viewer question, proof, and next step.</desc>
  <rect width="1200" height="675" rx="32" fill="#07111f"/>
  <text x="68" y="76" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">Choose the video by the viewer's next decision</text>
  <text x="68" y="112" fill="#9fb2c8" font-family="Arial, sans-serif" font-size="18">Shared source material does not make four finished formats interchangeable</text>
  <g font-family="Arial, sans-serif">
    <rect x="68" y="158" width="250" height="410" rx="22" fill="#10233a" stroke="#60a5fa" stroke-width="2"/>
    <text x="92" y="202" fill="#bfdbfe" font-size="21" font-weight="700">Application</text>
    <text x="92" y="244" fill="#f8fafc" font-size="15" font-weight="700">Question</text><text x="92" y="270" fill="#cbd5e1" font-size="14">Who are the founders?</text>
    <text x="92" y="320" fill="#f8fafc" font-size="15" font-weight="700">Proof</text><text x="92" y="346" fill="#cbd5e1" font-size="14">Founder communication</text>
    <text x="92" y="396" fill="#f8fafc" font-size="15" font-weight="700">Next step</text><text x="92" y="422" fill="#cbd5e1" font-size="14">Continue application review</text>
    <rect x="340" y="158" width="250" height="410" rx="22" fill="#10233a" stroke="#fbbf24" stroke-width="2"/>
    <text x="364" y="202" fill="#fde68a" font-size="21" font-weight="700">Product demo</text>
    <text x="364" y="244" fill="#f8fafc" font-size="15" font-weight="700">Question</text><text x="364" y="270" fill="#cbd5e1" font-size="14">Does one workflow work?</text>
    <text x="364" y="320" fill="#f8fafc" font-size="15" font-weight="700">Proof</text><text x="364" y="346" fill="#cbd5e1" font-size="14">Action and visible result</text>
    <text x="364" y="396" fill="#f8fafc" font-size="15" font-weight="700">Next step</text><text x="364" y="422" fill="#cbd5e1" font-size="14">Product follow-up</text>
    <rect x="612" y="158" width="250" height="410" rx="22" fill="#10233a" stroke="#a78bfa" stroke-width="2"/>
    <text x="636" y="202" fill="#ddd6fe" font-size="21" font-weight="700">Demo Day pitch</text>
    <text x="636" y="244" fill="#f8fafc" font-size="15" font-weight="700">Question</text><text x="636" y="270" fill="#cbd5e1" font-size="14">Worth a conversation now?</text>
    <text x="636" y="320" fill="#f8fafc" font-size="15" font-weight="700">Proof</text><text x="636" y="346" fill="#cbd5e1" font-size="14">Memorable company case</text>
    <text x="636" y="396" fill="#f8fafc" font-size="15" font-weight="700">Next step</text><text x="636" y="422" fill="#cbd5e1" font-size="14">Investor meeting</text>
    <rect x="884" y="158" width="250" height="410" rx="22" fill="#10233a" stroke="#5eead4" stroke-width="2"/>
    <text x="908" y="202" fill="#99f6e4" font-size="21" font-weight="700">Follow-up</text>
    <text x="908" y="244" fill="#f8fafc" font-size="15" font-weight="700">Question</text><text x="908" y="270" fill="#cbd5e1" font-size="14">Can you resolve this issue?</text>
    <text x="908" y="320" fill="#f8fafc" font-size="15" font-weight="700">Proof</text><text x="908" y="346" fill="#cbd5e1" font-size="14">Narrow contextual evidence</text>
    <text x="908" y="396" fill="#f8fafc" font-size="15" font-weight="700">Next step</text><text x="908" y="422" fill="#cbd5e1" font-size="14">Continue review</text>
  </g>
  <text x="68" y="622" fill="#5eead4" font-family="Arial, sans-serif" font-size="14">VideoClaw editorial illustration · owned asset · no third-party marks</text>
</svg>
