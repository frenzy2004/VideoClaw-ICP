<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Startup fundraising asset jobs map</title>
  <desc id="desc">A central viewer decision connects to five assets: live pitch, recorded pitch, product demo, pitch deck, and data room, each answering a different question.</desc>
  <rect width="1200" height="675" rx="32" fill="#07111f"/>
  <text x="70" y="76" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">One viewer decision, five different asset jobs</text>
  <text x="70" y="112" fill="#9fb2c8" font-family="Arial, sans-serif" font-size="18">Do not ask one pitch video to replace the full fundraising system</text>
  <g stroke="#334b68" stroke-width="3">
    <path d="M600 332 L240 214"/><path d="M600 332 L450 190"/><path d="M600 332 L750 190"/><path d="M600 332 L960 214"/><path d="M600 332 L600 530"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="446" y="270" width="308" height="124" rx="26" fill="#134e4a" stroke="#5eead4" stroke-width="3"/>
    <text x="600" y="319" fill="#f8fafc" font-size="22" font-weight="700">Viewer decision</text>
    <text x="600" y="350" fill="#ccfbf1" font-size="16">What should happen next?</text>
    <rect x="82" y="148" width="316" height="112" rx="20" fill="#10233a" stroke="#60a5fa"/>
    <text x="240" y="188" fill="#f8fafc" font-size="20" font-weight="700">Live pitch</text><text x="240" y="218" fill="#bfdbfe" font-size="15">Worth a conversation now?</text>
    <rect x="292" y="112" width="316" height="112" rx="20" fill="#10233a" stroke="#a78bfa"/>
    <text x="450" y="152" fill="#f8fafc" font-size="20" font-weight="700">Recorded pitch</text><text x="450" y="182" fill="#ddd6fe" font-size="15">Can I assess asynchronously?</text>
    <rect x="592" y="112" width="316" height="112" rx="20" fill="#10233a" stroke="#fbbf24"/>
    <text x="750" y="152" fill="#f8fafc" font-size="20" font-weight="700">Product demo</text><text x="750" y="182" fill="#fde68a" font-size="15">Does one workflow work?</text>
    <rect x="802" y="148" width="316" height="112" rx="20" fill="#10233a" stroke="#fb7185"/>
    <text x="960" y="188" fill="#f8fafc" font-size="20" font-weight="700">Pitch deck</text><text x="960" y="218" fill="#fecdd3" font-size="15">Can I scan the full case?</text>
    <rect x="442" y="500" width="316" height="112" rx="20" fill="#10233a" stroke="#86efac"/>
    <text x="600" y="540" fill="#f8fafc" font-size="20" font-weight="700">Data room</text><text x="600" y="570" fill="#bbf7d0" font-size="15">Can I evaluate the evidence?</text>
  </g>
  <text x="70" y="642" fill="#5eead4" font-family="Arial, sans-serif" font-size="14">VideoClaw editorial illustration · owned asset · no third-party marks</text>
</svg>
