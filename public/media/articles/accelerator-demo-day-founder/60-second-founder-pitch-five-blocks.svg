<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Five-block founder pitch video worksheet</title>
  <desc id="description">A horizontal flow from the audience problem through desired change, product action, approved proof, and one next step, with evidence and removal controls underneath.</desc>
  <rect width="1200" height="675" rx="32" fill="#07111f"/>
  <text x="72" y="82" fill="#f8fafc" font-family="Arial, sans-serif" font-size="36" font-weight="700">60-second founder pitch: five evidence-linked blocks</text>
  <text x="72" y="119" fill="#9fb3c8" font-family="Arial, sans-serif" font-size="18">Editorial timing bands guide revision; they are not performance or delivery commitments.</text>
  <g font-family="Arial, sans-serif">
    <rect x="72" y="174" width="190" height="220" rx="18" fill="#10243b" stroke="#38bdf8" stroke-width="2"/>
    <text x="94" y="211" fill="#7dd3fc" font-size="16" font-weight="700">0–10 SEC</text>
    <text x="94" y="252" fill="#f8fafc" font-size="24" font-weight="700">1. Problem</text>
    <text x="94" y="286" fill="#cbd5e1" font-size="16">Person + situation</text>
    <text x="94" y="312" fill="#cbd5e1" font-size="16">+ consequence</text>
    <text x="94" y="357" fill="#93c5fd" font-size="15">Source: customer</text>
    <text x="94" y="380" fill="#93c5fd" font-size="15">or operating evidence</text>

    <rect x="286" y="174" width="190" height="220" rx="18" fill="#10243b" stroke="#2dd4bf" stroke-width="2"/>
    <text x="308" y="211" fill="#5eead4" font-size="16" font-weight="700">10–20 SEC</text>
    <text x="308" y="252" fill="#f8fafc" font-size="24" font-weight="700">2. Change</text>
    <text x="308" y="286" fill="#cbd5e1" font-size="16">Current state →</text>
    <text x="308" y="312" fill="#cbd5e1" font-size="16">desired state</text>
    <text x="308" y="357" fill="#99f6e4" font-size="15">Source: approved</text>
    <text x="308" y="380" fill="#99f6e4" font-size="15">positioning</text>

    <rect x="500" y="174" width="190" height="220" rx="18" fill="#10243b" stroke="#a78bfa" stroke-width="2"/>
    <text x="522" y="211" fill="#c4b5fd" font-size="16" font-weight="700">20–38 SEC</text>
    <text x="522" y="252" fill="#f8fafc" font-size="24" font-weight="700">3. Action</text>
    <text x="522" y="286" fill="#cbd5e1" font-size="16">One product</text>
    <text x="522" y="312" fill="#cbd5e1" font-size="16">sequence</text>
    <text x="522" y="357" fill="#ddd6fe" font-size="15">Label product state</text>
    <text x="522" y="380" fill="#ddd6fe" font-size="15">and demo context</text>

    <rect x="714" y="174" width="190" height="220" rx="18" fill="#10243b" stroke="#f59e0b" stroke-width="2"/>
    <text x="736" y="211" fill="#fcd34d" font-size="16" font-weight="700">38–50 SEC</text>
    <text x="736" y="252" fill="#f8fafc" font-size="24" font-weight="700">4. Proof</text>
    <text x="736" y="286" fill="#cbd5e1" font-size="16">One supportable</text>
    <text x="736" y="312" fill="#cbd5e1" font-size="16">fact</text>
    <text x="736" y="357" fill="#fde68a" font-size="15">Source + scope</text>
    <text x="736" y="380" fill="#fde68a" font-size="15">+ owner + date</text>

    <rect x="928" y="174" width="200" height="220" rx="18" fill="#10243b" stroke="#fb7185" stroke-width="2"/>
    <text x="950" y="211" fill="#fda4af" font-size="16" font-weight="700">50–60 SEC</text>
    <text x="950" y="252" fill="#f8fafc" font-size="24" font-weight="700">5. Next step</text>
    <text x="950" y="286" fill="#cbd5e1" font-size="16">One action for</text>
    <text x="950" y="312" fill="#cbd5e1" font-size="16">one audience</text>
    <text x="950" y="357" fill="#fecdd3" font-size="15">Destination +</text>
    <text x="950" y="380" fill="#fecdd3" font-size="15">response owner</text>

    <path d="M262 284H286M476 284H500M690 284H714M904 284H928" stroke="#64748b" stroke-width="4"/>
    <rect x="72" y="450" width="1056" height="144" rx="18" fill="#0b1b2d" stroke="#334155"/>
    <text x="96" y="490" fill="#f8fafc" font-size="21" font-weight="700">Keep-or-remove gate for every block</text>
    <text x="96" y="529" fill="#cbd5e1" font-size="17">KEEP when the wording has a source, accurate scope, owner, product-state label, and approved next step.</text>
    <text x="96" y="562" fill="#fda4af" font-size="17">REMOVE or narrow when any claim cannot be supported, permission is missing, or the visible demo conflicts with the words.</text>
    <text x="72" y="638" fill="#64748b" font-size="14">VideoClaw editorial illustration · owned rights · no third-party marks</text>
  </g>
</svg>
