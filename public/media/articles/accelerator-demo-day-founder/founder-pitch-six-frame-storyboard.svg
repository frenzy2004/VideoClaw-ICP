<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Six-frame founder pitch video storyboard</title>
  <desc id="desc">Six numbered storyboard frames move from customer situation to company change, founder insight, product proof, selected evidence, and next step. Factual frames have source IDs.</desc>
  <rect width="1200" height="675" rx="32" fill="#07111f"/>
  <text x="66" y="75" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">Founder pitch video: six-frame outline</text>
  <text x="66" y="110" fill="#9fb2c8" font-family="Arial, sans-serif" font-size="18">Lock the facts, preserve the founder's natural delivery</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(66 158)"><rect width="336" height="182" rx="20" fill="#10233a" stroke="#60a5fa" stroke-width="2"/><circle cx="42" cy="42" r="22" fill="#1d4ed8"/><text x="42" y="49" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">1</text><text x="78" y="48" fill="#f8fafc" font-size="19" font-weight="700">Customer situation</text><text x="28" y="94" fill="#bfdbfe" font-size="15">Who is stuck, doing what?</text><text x="28" y="132" fill="#94a3b8" font-size="13">Source: approved company brief</text></g>
    <g transform="translate(432 158)"><rect width="336" height="182" rx="20" fill="#10233a" stroke="#5eead4" stroke-width="2"/><circle cx="42" cy="42" r="22" fill="#0f766e"/><text x="42" y="49" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">2</text><text x="78" y="48" fill="#f8fafc" font-size="19" font-weight="700">Company change</text><text x="28" y="94" fill="#99f6e4" font-size="15">What becomes different?</text><text x="28" y="132" fill="#94a3b8" font-size="13">Source ID: S-01</text></g>
    <g transform="translate(798 158)"><rect width="336" height="182" rx="20" fill="#10233a" stroke="#a78bfa" stroke-width="2"/><circle cx="42" cy="42" r="22" fill="#6d28d9"/><text x="42" y="49" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">3</text><text x="78" y="48" fill="#f8fafc" font-size="19" font-weight="700">Founder insight</text><text x="28" y="94" fill="#ddd6fe" font-size="15">Why does this team see it?</text><text x="28" y="132" fill="#94a3b8" font-size="13">Approved bullet-led take</text></g>
    <g transform="translate(66 370)"><rect width="336" height="182" rx="20" fill="#10233a" stroke="#fbbf24" stroke-width="2"/><circle cx="42" cy="42" r="22" fill="#a16207"/><text x="42" y="49" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">4</text><text x="78" y="48" fill="#f8fafc" font-size="19" font-weight="700">Product proof</text><text x="28" y="94" fill="#fde68a" font-size="15">One action, one visible result</text><text x="28" y="132" fill="#94a3b8" font-size="13">Source ID: S-02</text></g>
    <g transform="translate(432 370)"><rect width="336" height="182" rx="20" fill="#10233a" stroke="#fb7185" stroke-width="2"/><circle cx="42" cy="42" r="22" fill="#be123c"/><text x="42" y="49" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">5</text><text x="78" y="48" fill="#f8fafc" font-size="19" font-weight="700">Selected evidence</text><text x="28" y="94" fill="#fecdd3" font-size="15">Only approved, sourced facts</text><text x="28" y="132" fill="#94a3b8" font-size="13">Source IDs: S-03 / S-04</text></g>
    <g transform="translate(798 370)"><rect width="336" height="182" rx="20" fill="#10233a" stroke="#86efac" stroke-width="2"/><circle cx="42" cy="42" r="22" fill="#15803d"/><text x="42" y="49" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">6</text><text x="78" y="48" fill="#f8fafc" font-size="19" font-weight="700">Next step</text><text x="28" y="94" fill="#bbf7d0" font-size="15">One CTA with one owner</text><text x="28" y="132" fill="#94a3b8" font-size="13">Source ID: S-05</text></g>
  </g>
  <text x="66" y="620" fill="#5eead4" font-family="Arial, sans-serif" font-size="14">VideoClaw editorial illustration · owned asset · no third-party marks</text>
