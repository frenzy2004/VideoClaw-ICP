<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Investor request to follow-up asset routing table</title>
  <desc id="description">A decision flow routes an investor question to a current deck, concise memo, product demonstration, controlled data-room item, permissioned reference, or live meeting.</desc>
  <rect width="1200" height="675" rx="32" fill="#07111f"/>
  <text x="70" y="78" fill="#f8fafc" font-family="Arial, sans-serif" font-size="36" font-weight="700">After Demo Day: route the question, not the file</text>
  <text x="70" y="116" fill="#9fb3c8" font-family="Arial, sans-serif" font-size="18">Choose the smallest accurate asset that preserves context, evidence, permissions, and access.</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="165" width="1060" height="80" rx="18" fill="#10243b" stroke="#38bdf8" stroke-width="2"/>
    <text x="96" y="197" fill="#7dd3fc" font-size="15" font-weight="700">START</text>
    <text x="96" y="227" fill="#f8fafc" font-size="22" font-weight="700">Write the investor's exact question and intended disclosure context.</text>

    <path d="M600 245V285" stroke="#64748b" stroke-width="4"/>
    <path d="M588 273L600 288L612 273" fill="none" stroke="#64748b" stroke-width="4"/>

    <rect x="70" y="300" width="320" height="105" rx="16" fill="#0b1b2d" stroke="#2dd4bf"/>
    <text x="94" y="334" fill="#5eead4" font-size="15" font-weight="700">STRUCTURED OVERVIEW</text>
    <text x="94" y="370" fill="#f8fafc" font-size="24" font-weight="700">Current deck</text>
    <text x="94" y="395" fill="#cbd5e1" font-size="14">Version + date + audience</text>

    <rect x="440" y="300" width="320" height="105" rx="16" fill="#0b1b2d" stroke="#a78bfa"/>
    <text x="464" y="334" fill="#c4b5fd" font-size="15" font-weight="700">REASONING OR TRADE-OFF</text>
    <text x="464" y="370" fill="#f8fafc" font-size="24" font-weight="700">Memo or meeting</text>
    <text x="464" y="395" fill="#cbd5e1" font-size="14">Facts separate from interpretation</text>

    <rect x="810" y="300" width="320" height="105" rx="16" fill="#0b1b2d" stroke="#f59e0b"/>
    <text x="834" y="334" fill="#fcd34d" font-size="15" font-weight="700">VISIBLE PRODUCT ACTION</text>
    <text x="834" y="370" fill="#f8fafc" font-size="24" font-weight="700">Narrow demo</text>
    <text x="834" y="395" fill="#cbd5e1" font-size="14">State + data + claim boundary</text>

    <rect x="70" y="438" width="320" height="105" rx="16" fill="#0b1b2d" stroke="#fb7185"/>
    <text x="94" y="472" fill="#fda4af" font-size="15" font-weight="700">CONTROLLED DILIGENCE</text>
    <text x="94" y="508" fill="#f8fafc" font-size="24" font-weight="700">Data-room item</text>
    <text x="94" y="533" fill="#cbd5e1" font-size="14">Access + owner + definition</text>

    <rect x="440" y="438" width="320" height="105" rx="16" fill="#0b1b2d" stroke="#38bdf8"/>
    <text x="464" y="472" fill="#7dd3fc" font-size="15" font-weight="700">THIRD-PARTY EXPERIENCE</text>
    <text x="464" y="508" fill="#f8fafc" font-size="24" font-weight="700">Reference</text>
    <text x="464" y="533" fill="#cbd5e1" font-size="14">Explicit permission + context</text>

    <rect x="810" y="438" width="320" height="105" rx="16" fill="#0b1b2d" stroke="#2dd4bf"/>
    <text x="834" y="472" fill="#5eead4" font-size="15" font-weight="700">INTERACTIVE DECISION</text>
    <text x="834" y="508" fill="#f8fafc" font-size="24" font-weight="700">Live meeting</text>
    <text x="834" y="533" fill="#cbd5e1" font-size="14">Agenda + owner + next decision</text>

    <rect x="70" y="580" width="1060" height="55" rx="14" fill="#0b1b2d" stroke="#334155"/>
    <text x="94" y="615" fill="#cbd5e1" font-size="16">Every route ends with: approved evidence · correct access · one next step · refresh trigger</text>
    <text x="70" y="660" fill="#64748b" font-size="14">VideoClaw editorial illustration · owned rights · no third-party marks</text>
  </g>
</svg>
