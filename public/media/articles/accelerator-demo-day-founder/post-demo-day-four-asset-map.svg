<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Four-asset post-Demo Day narrative map</title>
  <desc id="description">A source pack feeds four distinct assets: a factual recap, a product-proof explanation, a milestone or learning update, and a stable next-step destination.</desc>
  <rect width="1200" height="675" rx="32" fill="#07111f"/>
  <text x="70" y="80" fill="#f8fafc" font-family="Arial, sans-serif" font-size="36" font-weight="700">After Demo Day: publish by viewer question</text>
  <text x="70" y="118" fill="#9fb3c8" font-family="Arial, sans-serif" font-size="18">One approved source pack, four distinct jobs, one refresh trigger per asset.</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="190" width="250" height="280" rx="22" fill="#0b1b2d" stroke="#64748b" stroke-width="2"/>
    <text x="98" y="230" fill="#f8fafc" font-size="24" font-weight="700">Approved inputs</text>
    <text x="98" y="274" fill="#cbd5e1" font-size="17">Pitch story</text>
    <text x="98" y="307" fill="#cbd5e1" font-size="17">Product sequence</text>
    <text x="98" y="340" fill="#cbd5e1" font-size="17">Claim sources</text>
    <text x="98" y="373" fill="#cbd5e1" font-size="17">Permissions</text>
    <text x="98" y="406" fill="#cbd5e1" font-size="17">Audience + CTA</text>
    <text x="98" y="447" fill="#93c5fd" font-size="15">Source-controlled</text>

    <path d="M320 330H390" stroke="#64748b" stroke-width="5"/>
    <path d="M380 318L395 330L380 342" fill="none" stroke="#64748b" stroke-width="5"/>

    <rect x="410" y="166" width="330" height="130" rx="18" fill="#10243b" stroke="#38bdf8" stroke-width="2"/>
    <text x="436" y="207" fill="#7dd3fc" font-size="16" font-weight="700">ASSET 1</text>
    <text x="436" y="241" fill="#f8fafc" font-size="23" font-weight="700">Factual recap</text>
    <text x="436" y="271" fill="#cbd5e1" font-size="16">What did the company present?</text>

    <rect x="770" y="166" width="360" height="130" rx="18" fill="#10243b" stroke="#2dd4bf" stroke-width="2"/>
    <text x="796" y="207" fill="#5eead4" font-size="16" font-weight="700">ASSET 2</text>
    <text x="796" y="241" fill="#f8fafc" font-size="23" font-weight="700">Product proof</text>
    <text x="796" y="271" fill="#cbd5e1" font-size="16">Can I see the relevant action?</text>

    <rect x="410" y="326" width="330" height="144" rx="18" fill="#10243b" stroke="#a78bfa" stroke-width="2"/>
    <text x="436" y="367" fill="#c4b5fd" font-size="16" font-weight="700">ASSET 3</text>
    <text x="436" y="401" fill="#f8fafc" font-size="23" font-weight="700">Learning update</text>
    <text x="436" y="431" fill="#cbd5e1" font-size="16">What changed or was learned?</text>

    <rect x="770" y="326" width="360" height="144" rx="18" fill="#10243b" stroke="#fb7185" stroke-width="2"/>
    <text x="796" y="367" fill="#fda4af" font-size="16" font-weight="700">ASSET 4</text>
    <text x="796" y="401" fill="#f8fafc" font-size="23" font-weight="700">Next-step destination</text>
    <text x="796" y="431" fill="#cbd5e1" font-size="16">How does this viewer continue?</text>

    <rect x="70" y="522" width="1060" height="92" rx="18" fill="#0b1b2d" stroke="#334155"/>
    <text x="96" y="558" fill="#f8fafc" font-size="20" font-weight="700">Release gate</text>
    <text x="96" y="588" fill="#cbd5e1" font-size="16">Distinct question · approved evidence · cleared rights · owned destination · named refresh trigger</text>
    <text x="70" y="648" fill="#64748b" font-size="14">VideoClaw editorial illustration · owned rights · no third-party marks</text>
  </g>
</svg>
