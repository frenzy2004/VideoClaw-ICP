<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Make a software tutorial a learner can reproduce</title><desc id="desc">A six-step sequence turns one software task into a verified procedure, paired script, clean recording, complete edit and observed learner test.</desc><rect width="1200" height="675" fill="#F1EDE1"/><text x="32" y="35" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#14151A">VIDEOCLAW</text><path d="M32 151 H1168" stroke="#C33672" stroke-width="3"/><text class="title" aria-label="Make a software tutorial a learner can reproduce" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#14151A"><tspan x="32" y="86.00">Make a software tutorial a learner can reproduce</tspan></text><rect class="card" x="32" y="174" width="368" height="232" rx="16" fill="#F1EDE1" stroke="#14151A" stroke-width="2"/><circle cx="62" cy="206" r="14" fill="#CBF3D9" stroke="#14151A" stroke-width="1"/><text x="62" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#14151A">1</text><text class="label" aria-label="Define the task" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#14151A"><tspan x="92" y="212.00">Define the task</tspan></text><text class="detail" aria-label="Write an outcome and the conditions needed to reach it." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="48" y="246.00">Write an outcome and the </tspan><tspan x="48" y="267.60">conditions needed to reach it.</tspan></text><rect class="card" x="416" y="174" width="368" height="232" rx="16" fill="#F1EDE1" stroke="#14151A" stroke-width="2"/><circle cx="446" cy="206" r="14" fill="#CBF3D9" stroke="#14151A" stroke-width="1"/><text x="446" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#14151A">2</text><text class="label" aria-label="Verify the procedure" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#14151A"><tspan x="476" y="212.00">Verify the procedure</tspan></text><text class="detail" aria-label="Perform every action from a clean starting state." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="432" y="246.00">Perform every action from a </tspan><tspan x="432" y="267.60">clean starting state.</tspan></text><rect class="card" x="800" y="174" width="368" height="232" rx="16" fill="#F1EDE1" stroke="#14151A" stroke-width="2"/><circle cx="830" cy="206" r="14" fill="#CBF3D9" stroke="#14151A" stroke-width="1"/><text x="830" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#14151A">3</text><text class="label" aria-label="Pair screen and narration" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#14151A"><tspan x="860" y="212.00">Pair screen and </tspan><tspan x="860" y="236.00">narration</tspan></text><text class="detail" aria-label="Describe essential visual changes as they occur." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="816" y="270.00">Describe essential visual </tspan><tspan x="816" y="291.60">changes as they occur.</tspan></text><rect class="card" x="32" y="422" width="368" height="232" rx="16" fill="#F1EDE1" stroke="#14151A" stroke-width="2"/><circle cx="62" cy="454" r="14" fill="#CBF3D9" stroke="#14151A" stroke-width="1"/><text x="62" y="460" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#14151A">4</text><text class="label" aria-label="Record clear sections" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#14151A"><tspan x="92" y="460.00">Record clear sections</tspan></text><text class="detail" aria-label="Keep example data and interface states consistent." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="48" y="494.00">Keep example data and </tspan><tspan x="48" y="515.60">interface states consistent.</tspan></text><rect class="card" x="416" y="422" width="368" height="232" rx="16" fill="#F1EDE1" stroke="#14151A" stroke-width="2"/><circle cx="446" cy="454" r="14" fill="#CBF3D9" stroke="#14151A" stroke-width="1"/><text x="446" y="460" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#14151A">5</text><text class="label" aria-label="Edit for reproduction" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#14151A"><tspan x="476" y="460.00">Edit for reproduction</tspan></text><text class="detail" aria-label="Retain required steps and explain omitted waiting time." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="432" y="494.00">Retain required steps and </tspan><tspan x="432" y="515.60">explain omitted waiting time.</tspan></text><rect class="card" x="800" y="422" width="368" height="232" rx="16" fill="#F1EDE1" stroke="#14151A" stroke-width="2"/><circle cx="830" cy="454" r="14" fill="#CBF3D9" stroke="#14151A" stroke-width="1"/><text x="830" y="460" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#14151A">6</text><text class="label" aria-label="Test with a learner" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#14151A"><tspan x="860" y="460.00">Test with a learner</tspan></text><text class="detail" aria-label="Observe completion without supplying missing instructions." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="816" y="494.00">Observe completion without </tspan><tspan x="816" y="515.60">supplying missing instructions.</tspan></text></svg>
