<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">From investor request to a useful response</title><desc id="desc">An investor follow-up connects accurate conversation notes to the requested asset, an evidence check, a concise email, and an owned next action.</desc><rect width="1200" height="675" fill="#F1EDE1"/><text x="32" y="35" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#14151A">VIDEOCLAW</text><path d="M32 151 H1168" stroke="#C33672" stroke-width="3"/><text class="title" aria-label="From investor request to a useful response" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#14151A"><tspan x="32" y="86.00">From investor request to a useful response</tspan></text><rect class="card" x="32" y="174" width="368" height="232" rx="16" fill="#F1EDE1" stroke="#14151A" stroke-width="2"/><circle cx="62" cy="206" r="14" fill="#CBF3D9" stroke="#14151A" stroke-width="1"/><text x="62" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#14151A">1</text><text class="label" aria-label="Recover the context" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#14151A"><tspan x="92" y="212.00">Recover the context</tspan></text><text class="detail" aria-label="Record where you connected and the exact question or request." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="48" y="246.00">Record where you connected </tspan><tspan x="48" y="267.60">and the exact question or </tspan><tspan x="48" y="289.20">request.</tspan></text><rect class="card" x="416" y="174" width="368" height="232" rx="16" fill="#F1EDE1" stroke="#14151A" stroke-width="2"/><circle cx="446" cy="206" r="14" fill="#CBF3D9" stroke="#14151A" stroke-width="1"/><text x="446" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#14151A">2</text><text class="label" aria-label="Choose the right asset" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#14151A"><tspan x="476" y="212.00">Choose the right asset</tspan></text><text class="detail" aria-label="Send the deck, answer, or workflow recording that addresses the request." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="432" y="246.00">Send the deck, answer, or </tspan><tspan x="432" y="267.60">workflow recording that </tspan><tspan x="432" y="289.20">addresses the request.</tspan></text><rect class="card" x="800" y="174" width="368" height="232" rx="16" fill="#F1EDE1" stroke="#14151A" stroke-width="2"/><circle cx="830" cy="206" r="14" fill="#CBF3D9" stroke="#14151A" stroke-width="1"/><text x="830" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#14151A">3</text><text class="label" aria-label="Verify the details" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#14151A"><tspan x="860" y="212.00">Verify the details</tspan></text><text class="detail" aria-label="Check facts, permissions, version dates, and any unresolved answer." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="816" y="246.00">Check facts, permissions, </tspan><tspan x="816" y="267.60">version dates, and any </tspan><tspan x="816" y="289.20">unresolved answer.</tspan></text><rect class="card" x="32" y="422" width="368" height="232" rx="16" fill="#F1EDE1" stroke="#14151A" stroke-width="2"/><circle cx="62" cy="454" r="14" fill="#CBF3D9" stroke="#14151A" stroke-width="1"/><text x="62" y="460" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#14151A">4</text><text class="label" aria-label="Write the next step" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#14151A"><tspan x="92" y="460.00">Write the next step</tspan></text><text class="detail" aria-label="Make one clear request or confirm the action already agreed." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="48" y="494.00">Make one clear request or </tspan><tspan x="48" y="515.60">confirm the action already </tspan><tspan x="48" y="537.20">agreed.</tspan></text><rect class="card" x="416" y="422" width="368" height="232" rx="16" fill="#F1EDE1" stroke="#14151A" stroke-width="2"/><circle cx="446" cy="454" r="14" fill="#CBF3D9" stroke="#14151A" stroke-width="1"/><text x="446" y="460" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#14151A">5</text><text class="label" aria-label="Track the promise" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#14151A"><tspan x="476" y="460.00">Track the promise</tspan></text><text class="detail" aria-label="Assign a responsible person and realistic date to each follow-up item." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="432" y="494.00">Assign a responsible person and </tspan><tspan x="432" y="515.60">realistic date to each </tspan><tspan x="432" y="537.20">follow-up item.</tspan></text></svg>
