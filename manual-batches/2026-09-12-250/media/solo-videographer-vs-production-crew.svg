<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Size the crew around simultaneous work</title><desc id="desc">Camera, sound, direction and equipment tasks are mapped against the same session to expose coverage conflicts.</desc><rect width="1200" height="675" fill="#F1EDE1"/><text x="32" y="35" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#14151A">VIDEOCLAW</text><path d="M32 151 H1168" stroke="#C33672" stroke-width="3"/><text class="title" aria-label="Size the crew around simultaneous work" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#14151A"><tspan x="32" y="86.00">Size the crew around simultaneous work</tspan></text><rect class="card" x="32" y="174" width="368" height="232" rx="16" fill="#F1EDE1" stroke="#14151A" stroke-width="2"/><circle cx="62" cy="206" r="14" fill="#CBF3D9" stroke="#14151A" stroke-width="1"/><text x="62" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#14151A">1</text><text class="label" aria-label="Map the session" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#14151A"><tspan x="92" y="212.00">Map the session</tspan></text><text class="detail" aria-label="Break the shoot into setup, takes, changes and wrap." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="48" y="246.00">Break the shoot into setup, </tspan><tspan x="48" y="267.60">takes, changes and wrap.</tspan></text><rect class="card" x="416" y="174" width="368" height="232" rx="16" fill="#F1EDE1" stroke="#14151A" stroke-width="2"/><circle cx="446" cy="206" r="14" fill="#CBF3D9" stroke="#14151A" stroke-width="1"/><text x="446" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#14151A">2</text><text class="label" aria-label="Place the duties" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#14151A"><tspan x="476" y="212.00">Place the duties</tspan></text><text class="detail" aria-label="Identify tasks that need attention at the same time." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="432" y="246.00">Identify tasks that need </tspan><tspan x="432" y="267.60">attention at the same time.</tspan></text><rect class="card" x="800" y="174" width="368" height="232" rx="16" fill="#F1EDE1" stroke="#14151A" stroke-width="2"/><circle cx="830" cy="206" r="14" fill="#CBF3D9" stroke="#14151A" stroke-width="1"/><text x="830" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#14151A">3</text><text class="label" aria-label="Resolve conflicts" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#14151A"><tspan x="860" y="212.00">Resolve conflicts</tspan></text><text class="detail" aria-label="Add support or simplify the session." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="816" y="246.00">Add support or simplify the </tspan><tspan x="816" y="267.60">session.</tspan></text><rect class="card" x="32" y="422" width="368" height="232" rx="16" fill="#F1EDE1" stroke="#14151A" stroke-width="2"/><circle cx="62" cy="454" r="14" fill="#CBF3D9" stroke="#14151A" stroke-width="1"/><text x="62" y="460" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#14151A">4</text><text class="label" aria-label="Confirm coverage" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#14151A"><tspan x="92" y="460.00">Confirm coverage</tspan></text><text class="detail" aria-label="Name who performs each essential duty." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="48" y="494.00">Name who performs each </tspan><tspan x="48" y="515.60">essential duty.</tspan></text></svg>
