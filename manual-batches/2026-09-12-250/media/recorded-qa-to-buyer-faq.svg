</tspan></text><text class="detail" aria-label="Read it without the surrounding session." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="48" y="494.00">Read it without the surrounding </tspan><tspan x="48" y="515.60">session.</tspan></text></svg>
