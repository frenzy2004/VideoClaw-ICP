<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Qualify the pilot and the proposed flight separately</title><desc id="desc">Pilot evidence and location feasibility feed a conditional shoot booking with a ground-footage fallback.</desc><rect width="1200" height="675" fill="#F1EDE1"/><text x="32" y="35" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#14151A">VIDEOCLAW</text><path d="M32 151 H1168" stroke="#C33672" stroke-width="3"/><text class="title" aria-label="Qualify the pilot and the proposed flight separately" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#14151A"><tspan x="32" y="86.00">Qualify the pilot and the proposed flight separately</tspan></text><rect class="card" x="32" y="174" width="368" height="232" rx="16" fill="#F1EDE1" stroke="#14151A" stroke-width="2"/><circle cx="62" cy="206" r="14" fill="#CBF3D9" stroke="#14151A" stroke-width="1"/><text x="62" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#14151A">1</text><text class="label" aria-label="Define the aerial purpose" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#14151A"><tspan x="92" y="212.00">Define the aerial purpose</tspan></text><text class="detail" aria-label="Specify the view the footage must communicate." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="48" y="246.00">Specify the view the footage </tspan><tspan x="48" y="267.60">must communicate.</tspan></text><rect class="card" x="416" y="174" width="368" height="232" rx="16" fill="#F1EDE1" stroke="#14151A" stroke-width="2"/><circle cx="446" cy="206" r="14" fill="#CBF3D9" stroke="#14151A" stroke-width="1"/><text x="446" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#14151A">2</text><text class="label" aria-label="Verify the operator" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#14151A"><tspan x="476" y="212.00">Verify the operator</tspan></text><text class="detail" aria-label="Request identity, certificate and recency evidence." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="432" y="246.00">Request identity, certificate </tspan><tspan x="432" y="267.60">and recency evidence.</tspan></text><rect class="card" x="800" y="174" width="368" height="232" rx="16" fill="#F1EDE1" stroke="#14151A" stroke-width="2"/><circle cx="830" cy="206" r="14" fill="#CBF3D9" stroke="#14151A" stroke-width="1"/><text x="830" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#14151A">3</text><text class="label" aria-label="Check the proposed flight" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#14151A"><tspan x="860" y="212.00">Check the proposed </tspan><tspan x="860" y="236.00">flight</tspan></text><text class="detail" aria-label="Ask for location-specific authorization and constraint evidence." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="816" y="270.00">Ask for location-specific </tspan><tspan x="816" y="291.60">authorization and constraint </tspan><tspan x="816" y="313.20">evidence.</tspan></text><rect class="card" x="32" y="422" width="368" height="232" rx="16" fill="#F1EDE1" stroke="#14151A" stroke-width="2"/><circle cx="62" cy="454" r="14" fill="#CBF3D9" stroke="#14151A" stroke-width="1"/><text x="62" y="460" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#14151A">4</text><text class="label" aria-label