ble </tspan><tspan x="92" y="484.00">route</tspan></text><text class="detail" aria-label="Compare complete quotes and remaining dependencies." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="48" y="518.00">Compare complete quotes and </tspan><tspan x="48" y="539.60">remaining dependencies.</tspan></text></svg>
