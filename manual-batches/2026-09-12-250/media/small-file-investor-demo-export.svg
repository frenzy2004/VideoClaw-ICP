<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Smaller file, preserved proof</title><desc id="desc">Compare source-master export candidates against required text, motion and audio before selecting a delivery copy.</desc><rect width="1200" height="675" fill="#F1EDE1"/><text x="32" y="35" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#14151A">VIDEOCLAW</text><path d="M32 151 H1168" stroke="#C33672" stroke-width="3"/><text class="title" aria-label="Smaller file, preserved proof" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#14151A"><tspan x="32" y="86.00">Smaller file, preserved proof</tspan></text><rect class="card" x="32" y="174" width="368" height="232" rx="16" fill="#F1EDE1" stroke="#14151A" stroke-width="2"/><circle cx="62" cy="206" r="14" fill="#CBF3D9" stroke="#14151A" stroke-width="1"/><text x="62" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#14151A">1</text><text class="label" aria-label="Set the proof floor" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#14151A"><tspan x="92" y="212.00">Set the proof floor</tspan></text><text class="detail" aria-label="Name the values, result and qualification that must survive." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="48" y="246.00">Name the values, result and </tspan><tspan x="48" y="267.60">qualification that must survive.</tspan></text><rect class="card" x="416" y="174" width="368" height="232" rx="16" fill="#F1EDE1" stroke="#14151A" stroke-width="2"/><circle cx="446" cy="206" r="14" fill="#CBF3D9" stroke="#14151A" stroke-width="1"/><text x="446" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#14151A">2</text><text class="label" aria-label="Export candidates" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#14151A"><tspan x="476" y="212.00">Export candidates</tspan></text><text class="detail" aria-label="Change one main variable and keep the master intact." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="432" y="246.00">Change one main variable and </tspan><tspan x="432" y="267.60">keep the master intact.</tspan></text><rect class="card" x="800" y="174" width="368" height="232" rx="16" fill="#F1EDE1" stroke="#14151A" stroke-width="2"/><circle cx="830" cy="206" r="14" fill="#CBF3D9" stroke="#14151A" stroke-width="1"/><text x="830" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#14151A">3</text><text class="label" aria-label="Read and listen" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#14151A"><tspan x="860" y="212.00">Read and listen</tspan></text><text class="detail" aria-label="Test the actual player at the intended viewing size." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="816" y="246.00">Test the actual player at the </tspan><tspan x="816" y="267.60">intended viewing size.</tspan></text><rect class="card" x="32" y="422" width="368" height="232" rx="16" fill="#F1EDE1" stroke="#14151A" stroke-width="2"/><circle cx="62" cy="454" r="14" fill="#CBF3D9" stroke="#14151A" stroke-width="1"/><text x="62" y="460" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#14151A">4</text><text class="label" aria-label="Choose the passing copy" xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#14151A"><tspan x="92" y="460.00">Choose the passing copy</tspan></text><text class="detail" aria-label="Meet the delivery constraint without losing the evidence." xml:space="preserve" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14151A"><tspan x="48" y="494.00">Meet the delivery constraint </tspan><tspan x="48" y="515.60">without losing the evidence.</tspan></text></svg>
